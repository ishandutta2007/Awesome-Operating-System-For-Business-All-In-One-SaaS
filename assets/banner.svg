<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <style>
      @keyframes floatSlow1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(40px, -20px) scale(1.1); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes floatSlow2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-30px, 25px) scale(0.95); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes pulseNode {
        0%, 100% { opacity: 0.2; transform: scale(0.9); }
        50% { opacity: 0.8; transform: scale(1.1); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes pillFloat1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pillFloat2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }

      .bg-orb-1 { animation: floatSlow1 12s ease-in-out infinite; }
      .bg-orb-2 { animation: floatSlow2 15s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 6 8; animation: dashMove 20s linear infinite; }
      .pill-1 { animation: pillFloat1 6s ease-in-out infinite; }
      .pill-2 { animation: pillFloat2 7s ease-in-out infinite; }
      .node-pulse-1 { animation: pulseNode 4s ease-in-out infinite; }
      .node-pulse-2 { animation: pulseNode 5s ease-in-out infinite 1s; }
      .node-pulse-3 { animation: pulseNode 4.5s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Ambient Nebula Glows (Background Layer) -->
  <g filter="url(#blurFilter)">
    <circle class="bg-orb-1" cx="220" cy="100" r="140" fill="url(#glowGrad1)" />
    <circle class="bg-orb-2" cx="980" cy="240" r="160" fill="url(#glowGrad2)" />
  </g>

  <!-- Geometric Grid & Data Constellations (Subtle Background) -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="280" x2="1200" y2="280" />
  </g>

  <!-- Dynamic Animated Flow Streams Behind Badges/Pills -->
  <g class="flow-line" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.4">
    <path d="M 50 140 Q 300 40 600 130 T 1150 120" />
    <path d="M 50 250 Q 350 330 650 230 T 1150 260" stroke="#38bdf8" />
  </g>

  <!-- Pulsing Orbit Nodes (Ambient) -->
  <circle class="node-pulse-1" cx="240" cy="80" r="4" fill="#38bdf8" />
  <circle class="node-pulse-2" cx="950" cy="110" r="5" fill="#818cf8" />
  <circle class="node-pulse-3" cx="1020" cy="270" r="4.5" fill="#c084fc" />
  <circle class="node-pulse-1" cx="140" cy="270" r="3.5" fill="#34d399" />

  <!-- Animated Feature Badges (Pills) floating gently in background/flanks -->
  <g class="pill-1" transform="translate(80, 50)">
    <rect width="140" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="70" y="20" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">💼 CRM &amp; SALES</text>
  </g>

  <g class="pill-2" transform="translate(980, 50)">
    <rect width="140" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
    <text x="70" y="20" fill="#c084fc" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">📊 ERP &amp; FINANCE</text>
  </g>

  <g class="pill-2" transform="translate(90, 275)">
    <rect width="150" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <text x="75" y="20" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">⚡ OPEN-SOURCE</text>
  </g>

  <g class="pill-1" transform="translate(970, 275)">
    <rect width="150" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4" />
    <text x="75" y="20" fill="#f472b6" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">🤖 AI AGENT OS</text>
  </g>

  <!-- FOREGROUND: High Contrast Crisp Header & Value Proposition (Unobstructed) -->
  <!-- Top Tag / Pill -->
  <g transform="translate(460, 48)">
    <rect width="280" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="18" cy="14" r="5" fill="#22c55e" />
    <text x="145" y="18" fill="#e0e7ff" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="1.2">CURATED ENTERPRISE DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" fill="url(#textGrad)" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
    Operating System For Business
  </text>

  <!-- Subtitle -->
  <text x="600" y="188" fill="#f8fafc" font-size="21" font-weight="600" text-anchor="middle" letter-spacing="0.2">
    All-In-One SaaS Suites &amp; Open-Source Alternatives
  </text>

  <!-- Value Description Statement -->
  <text x="600" y="222" fill="#94a3b8" font-size="14.5" font-weight="400" text-anchor="middle" letter-spacing="0.1">
    ERP • CRM • Accounting &amp; Invoicing • HCM &amp; Payroll • Project Management • AI Automation
  </text>

  <!-- Central Metric Stat Pills Bar -->
  <g transform="translate(360, 260)">
    <rect width="480" height="42" rx="21" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <text x="80" y="26" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">☁️ Commercial SaaS</text>
    <text x="160" y="26" fill="#475569" font-size="14" text-anchor="middle">|</text>
    <text x="240" y="26" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">🔓 Self-Hosted OSS</text>
    <text x="320" y="26" fill="#475569" font-size="14" text-anchor="middle">|</text>
    <text x="400" y="26" fill="#c084fc" font-size="13" font-weight="700" text-anchor="middle">⚡ MCP AI Ready</text>
  </g>
</svg>
